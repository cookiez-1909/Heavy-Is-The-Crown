[package]
name = "xarena"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["unstable"] }
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing", "unstable"] }

# A standalone crate: the spike stays outside the main workspace.
[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
