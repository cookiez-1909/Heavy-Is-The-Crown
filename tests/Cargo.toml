[package]
name = "duel-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
bs58 = "0.5"
sha2 = "0.10"
# System OpenSSL headers are not required: build it from source.
openssl = { version = "0.10", features = ["vendored"] }
